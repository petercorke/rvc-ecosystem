name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Test the notebook tools
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests -q

  all-tests-passed:
    name: All tests passed
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check the test matrix
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "tests did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
